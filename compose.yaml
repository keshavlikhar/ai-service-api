services:
  api:
    build:
      context: .
    image: ai-service-api:dev
    init: true
    read_only: true
    tmpfs:
      - /tmp
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 3